plugins {
    id 'com.android.application'
}

// Release signing is optional: set these four environment variables (the GitHub
// workflow does this from repository secrets) to produce a signed release APK.
def releaseKeystore = System.getenv("SIGNING_KEYSTORE_PATH")
def hasReleaseSigning = releaseKeystore != null && file(releaseKeystore).exists()

android {
    namespace 'io.github.htbnoob.seestarplanner'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.htbnoob.seestarplanner'
        minSdk 26
        targetSdk 35
        // CI run number -> every build installs as an update over the previous one.
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1") as int)
        versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    signingConfigs {
        // Committed, non-secret debug key (standard "android" passwords) so debug APKs
        // from different CI runs share a signature and can be installed as updates.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

base {
    archivesName = "SeestarPlanner"
}
